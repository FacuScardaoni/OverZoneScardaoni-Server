plugins {
  id 'java'
  id 'application'
}

version = "$projectVersion"

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenCentral()
}

dependencies {
  // Solo el núcleo de LibGDX, por las clases de matemática que comparte con el
  // cliente (Rectangle, Vector2). El servidor no abre ventana ni dibuja, así
  // que no necesita el resto de LibGDX.
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

application {
  mainClass = 'com.OverZone.Scardaoni.servidor.LanzadorServidor'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

// Permite escribir comandos en la consola del servidor con "gradlew run".
tasks.named('run') {
  standardInput = System.in
}

// "gradlew jar" genera un .jar que se ejecuta solo, desde el cmd:
//   java -jar build\libs\OverZone-Server-1.0.0.jar
jar {
  archiveFileName = "OverZone-Server-${version}.jar"
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  manifest {
    attributes 'Main-Class': 'com.OverZone.Scardaoni.servidor.LanzadorServidor'
  }
}
